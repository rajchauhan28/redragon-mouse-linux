name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: Driver & CLI (zero-dep, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-26.04
          - python-version: "3.14"
            os: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify driver imports without Qt
        run: |
          python -c "import sys; sys.modules['PySide6'] = None; import m693, m693.cli, m693.keys, m693.transfer"
      - name: Run headless protocol & CLI suites
        run: |
          python tests/test_unknowns.py
          python tests/test_retry.py
          python tests/test_battery.py
          python tests/test_pairing_and_cleanup.py
          python tests/test_inspect_installer.py
      - name: Build sdist & wheel
        run: |
          python -m pip install --upgrade build
          python -m build

  gui:
    name: Full GUI + Offscreen Qt Suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt system libraries & PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 desktop-file-utils
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
      - name: Run all test suites (QT_QPA_PLATFORM=offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in tests/test_*.py; do
            echo "=== $t ==="
            python "$t"
          done
